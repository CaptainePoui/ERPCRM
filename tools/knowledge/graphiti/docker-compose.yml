# Infrastructure Graphiti + Neo4j pour Simple IP Platform.
# Base sur github.com/getzep/graphiti mcp_server/docker/docker-compose-neo4j.yml,
# adapte : ecoute localhost seulement, image graphiti-mcp construite localement
# depuis la release officielle v0.29.3 (commit immuable
# 021d3a57d511f21b10adaf7fa923bd5c1fce5e9d), PAS depuis le HEAD mouvant de main
# et PAS l'image Docker Hub (restee bloquee a 0.28.2). Voir
# graphiti-build/build.sh pour reproduire le build. NOTE : cette image
# (0.29.3) exige OPENAI_API_KEY pour demarrer -- pas de degradation
# gracieuse comme 0.28.2 (voir CLAUDE_TOOLING.md). Le service graphiti-mcp
# reste arrete tant que la cle n'est pas fournie.
#
# Demarrage : docker compose --env-file .env up -d
# Voir CLAUDE_TOOLING.md pour la procedure complete (demarrage/arret/backup).

services:
  neo4j:
    image: neo4j:5.26.0
    ports:
      - "127.0.0.1:7474:7474" # HTTP (dashboard Neo4j)
      - "127.0.0.1:7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD requis, voir .env.example}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  graphiti-mcp:
    image: graphiti-mcp-standalone:v0.29.3-021d3a5
    env_file:
      - path: .env
        required: true
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD requis, voir .env.example}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-platform}
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-10}
      - CONFIG_PATH=/app/mcp/config/config.yaml
    volumes:
      - ./config/config-docker-neo4j.yaml:/app/mcp/config/config.yaml:ro
      - bge_reranker_cache:/root/.cache/huggingface # persiste BAAI/bge-reranker-v2-m3 (~2.3 Go) entre recreations
    extra_hosts:
      - "host.docker.internal:host-gateway" # pour joindre Ollama local sur l'hote (voir OPENAI_API_URL dans .env)
    ports:
      - "127.0.0.1:8000:8000" # MCP HTTP transport, LAN/Internet non expose
    command: ["uv", "run", "main.py"]
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  bge_reranker_cache:
