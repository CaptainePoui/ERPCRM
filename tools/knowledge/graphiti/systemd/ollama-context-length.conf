# Sans VRAM (CPU seul), Ollama charge par defaut un contexte de 4096 tokens --
# insuffisant pour le pipeline d'extraction Graphiti (prompt ~3-4K tokens + JSON de
# sortie), ce qui tronquait les reponses (finish_reason=length). Valide le
# 2026-08-23 avec gpt-oss:20b + Graphiti v0.29.3. Fichier separe de
# ollama-override.conf : ne touche pas au mecanisme dynamique OLLAMA_HOST.
[Service]
Environment="OLLAMA_CONTEXT_LENGTH=32768"
