# Graphiti MCP Server Configuration for Docker with Neo4j
# Source officielle : github.com/getzep/graphiti mcp_server/config/config-docker-neo4j.yaml
# Adapte pour Simple IP Platform : provider unique OpenAI (LLM + embeddings), voir ARCHITECTURE_PLATFORM.md

server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "openai"
  model: ${MODEL_NAME:gpt-4.1-mini}
  max_tokens: 4096
  # json_object : le modele local (Ollama) n'honore pas toujours json_schema de facon fiable --
  # voir README officiel mcp_server pour Ollama, recommandation explicite.
  structured_output_mode: "json_object"

  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:https://api.openai.com/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}

embedder:
  provider: "openai"
  model: ${EMBEDDER_MODEL:text-embedding-3-small}
  # 768 = dimension reelle de nomic-embed-text (Ollama), verifiee par appel direct a
  # /v1/embeddings le 2026-08-22. Ne PAS remettre 1536 (defaut OpenAI) -- graphiti_core
  # tronque silencieusement sans erreur si ca ne correspond pas (embedder/openai.py).
  dimensions: 768

  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:https://api.openai.com/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}

database:
  provider: "neo4j"

  providers:
    neo4j:
      uri: ${NEO4J_URI:bolt://neo4j:7687}
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:demodemo}
      database: ${NEO4J_DATABASE:neo4j}
      use_parallel_runtime: ${USE_PARALLEL_RUNTIME:false}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:platform}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:mcp_user}
  # Types d'entites par defaut de Graphiti (generiques). A remplacer en Phase H
  # par les types Simple IP Platform (Product, ControlPlane, TelephonyPlane,
  # ServerType, ServerInstance, Tenant, Task, Error, Decision, ...) -- voir
  # mission section 70. Laisses tels quels pour l'instant : l'installation
  # de base ne doit rien inventer avant la phase de configuration dediee.
  entity_types:
    - name: "Preference"
      description: "User preferences, choices, opinions, or selections (PRIORITIZE over most other types except User/Assistant)"
    - name: "Requirement"
      description: "Specific needs, features, or functionality that must be fulfilled"
    - name: "Procedure"
      description: "Standard operating procedures and sequential instructions"
    - name: "Location"
      description: "Physical or virtual places where activities occur"
    - name: "Event"
      description: "Time-bound activities, occurrences, or experiences"
    - name: "Organization"
      description: "Companies, institutions, groups, or formal entities"
    - name: "Document"
      description: "Information content in various forms (books, articles, reports, etc.)"
    - name: "Topic"
      description: "Subject of conversation, interest, or knowledge domain (use as last resort)"
    - name: "Object"
      description: "Physical items, tools, devices, or possessions (use as last resort)"
